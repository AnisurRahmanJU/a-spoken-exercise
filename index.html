<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F6F9FE">
<title>বাক্য সাজাও - Anis Spoken English Lab — </title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#F6F9FE; --card:#FFFFFF; --ink:#15264F; --ink2:#5B6B8C; --ink3:#93A0BB;
  --line:#DCE4F2; --line2:#C7D3E8;
  --blue:#1F6FEB; --blue-d:#1656BC; --blue-bg:#E4EEFF;
  --orange:#F5741F; --orange-d:#C95A12; --orange-bg:#FFEBDA;
  --green:#58CC02; --green-d:#46A302; --green-bg:#DFF7C4; --green-ink:#3B8500;
  --red:#FF4B4B; --red-d:#D93A3A; --red-bg:#FFDFE0; --red-ink:#C42B2B;
  --gold:#FFC800; --gold-d:#E0A800; --gold-bg:#FFF4CC;
  --bn:'Hind Siliguri','Noto Sans Bengali','Kalpurush','Nirmala UI',sans-serif;
  --en:'Nunito','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--bn);}
body{min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.en{font-family:var(--en)}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-family:var(--bn);font-weight:700;font-size:1.05rem;
  padding:14px 26px;border-radius:16px;min-height:52px;
  border:2px solid var(--line2);border-bottom-width:4px;background:#fff;color:var(--blue);
  transition:transform .08s,border-bottom-width .08s,margin-top .08s;
}
.btn:active{transform:translateY(2px);border-bottom-width:2px}
.btn.primary{background:var(--green);border-color:var(--green-d);color:#fff}
.btn.blue{background:var(--blue);border-color:var(--blue-d);color:#fff}
.btn.danger{background:var(--red);border-color:var(--red-d);color:#fff}
.btn.block{width:100%}
.btn[disabled]{background:#E7ECF5;border-color:#D3DBEA;color:#A2AEC6;cursor:not-allowed;transform:none}

/* ---------- top bar (home) ---------- */
.top{
  position:sticky;top:0;z-index:20;background:rgba(246,249,254,.94);backdrop-filter:blur(8px);
  border-bottom:2px solid var(--line);
}
.top-in{max-width:720px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand svg{width:40px;height:40px;flex:none}
.brand b{display:block;font-family:var(--en);font-weight:900;font-size:1.02rem;line-height:1.05;color:var(--ink);white-space:nowrap}
.brand b i{font-style:normal;color:var(--blue)}
.brand b u{text-decoration:none;color:var(--orange)}
.brand small{display:block;font-family:var(--en);font-size:.68rem;color:var(--ink2);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{display:flex;gap:6px;flex:none}
.chip{
  display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:12px;
  font-family:var(--en);font-weight:900;font-size:.95rem;background:#fff;border:2px solid var(--line);
}
.chip.fire{color:var(--orange)} .chip.xp{color:var(--gold-d)} .chip.done{color:var(--blue)}

/* ---------- hero ---------- */
.hero{max-width:720px;margin:0 auto;padding:22px 16px 6px;display:flex;gap:16px;align-items:center}
.hero .mascot{width:92px;height:92px;flex:none}
.hero h1{margin:0 0 6px;font-size:1.55rem;line-height:1.25;font-weight:700}
.hero p{margin:0;color:var(--ink2);font-size:1rem;line-height:1.6}
.overall{max-width:720px;margin:14px auto 0;padding:0 16px}
.bar{height:14px;background:#E3EAF6;border-radius:99px;overflow:hidden;position:relative}
.bar>i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .4s ease;position:relative}
.bar>i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:4px;background:rgba(255,255,255,.4);border-radius:4px}
.overall small{display:block;margin-top:6px;color:var(--ink2);font-size:.85rem}

/* ---------- path ---------- */
.path{max-width:720px;margin:0 auto;padding:10px 16px 90px;display:flex;flex-direction:column;align-items:center}
.unit{
  width:100%;margin:26px 0 22px;padding:14px 18px;border-radius:18px;color:#fff;
  border-bottom:5px solid rgba(0,0,0,.18);display:flex;justify-content:space-between;align-items:center;gap:12px;
}
.unit b{display:block;font-size:1.12rem;font-weight:700}
.unit span{font-size:.9rem;opacity:.92}
.unit em{font-style:normal;font-family:var(--en);font-weight:900;font-size:.95rem;background:rgba(255,255,255,.22);padding:6px 12px;border-radius:12px;white-space:nowrap}
.u0{background:var(--blue)} .u1{background:var(--orange)} .u2{background:#7C5CF0} .u3{background:#12A594} .u4{background:#E5488B}
.node-wrap{display:flex;flex-direction:column;align-items:center;margin:10px 0;position:relative}
.node{
  width:76px;height:70px;border-radius:50%/48%;background:var(--blue);color:#fff;
  border:0;border-bottom:8px solid var(--blue-d);font-family:var(--en);font-weight:900;font-size:1.5rem;
  display:flex;align-items:center;justify-content:center;transition:transform .08s;
}
.node:active{transform:translateY(5px);border-bottom-width:3px}
.node.done{background:var(--gold);border-bottom-color:var(--gold-d);color:#fff}
.node.cur{background:var(--green);border-bottom-color:var(--green-d)}
.node.cur::before{content:"";position:absolute;inset:-9px -9px 1px;border:5px solid var(--green-bg);border-radius:50%/48%;pointer-events:none}
.node svg{width:34px;height:34px}
.node-label{margin-top:8px;font-size:.86rem;font-weight:600;color:var(--ink2);text-align:center;max-width:150px;line-height:1.25}
.node-label.en{font-family:var(--en);font-weight:800}
.stars{display:flex;gap:2px;margin-top:2px}
.stars svg{width:14px;height:14px}
.start-tip{
  position:absolute;top:-38px;background:#fff;color:var(--green-ink);font-weight:700;padding:6px 14px;border-radius:12px;
  border:2px solid var(--line);font-size:.92rem;white-space:nowrap;animation:bob 1.4s ease-in-out infinite;
}
.start-tip::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:#fff;border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
@keyframes bob{50%{transform:translateY(-5px)}}
.foot{max-width:720px;margin:0 auto;padding:0 16px 40px;text-align:center;color:var(--ink3);font-size:.85rem}
.foot button{color:var(--ink2);text-decoration:underline;font-size:.85rem;margin-top:8px}

/* ---------- sheets / modals ---------- */
.backdrop{position:fixed;inset:0;background:rgba(21,38,79,.42);z-index:60;display:none;align-items:flex-end;justify-content:center}
.backdrop.open{display:flex}
.sheet{
  width:100%;max-width:560px;background:#fff;border-radius:26px 26px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));
  animation:up .22s ease-out;max-height:90vh;overflow:auto;
}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.tag{display:inline-block;font-family:var(--en);font-weight:900;color:#fff;background:var(--blue);padding:4px 12px;border-radius:99px;font-size:.9rem}
.sheet h2{margin:12px 0 8px;font-size:1.25rem;line-height:1.5;font-weight:600}
.structure{
  margin:12px 0 16px;padding:12px 14px;border-radius:14px;background:var(--blue-bg);border:2px solid #C5D9FA;
  font-family:var(--en);font-weight:800;color:var(--blue-d);font-size:1rem;line-height:1.55;word-break:break-word
}
.sheet .row{display:flex;flex-direction:column;gap:10px}
.meta{color:var(--ink2);font-size:.95rem;margin-bottom:14px}
.center{text-align:center}
@media(min-width:600px){.backdrop{align-items:center}.sheet{border-radius:26px}}

/* ---------- lesson ---------- */
#lesson{position:fixed;inset:0;z-index:40;background:#fff;display:none;flex-direction:column}
#lesson.open{display:flex}
.l-top{max-width:700px;width:100%;margin:0 auto;padding:14px 16px 6px;display:flex;align-items:center;gap:14px}
.x{width:36px;height:36px;border-radius:10px;color:var(--ink3);font-size:1.7rem;line-height:1;display:flex;align-items:center;justify-content:center}
.x:hover{background:#F0F4FB}
.l-top .bar{flex:1}
.hearts{display:flex;align-items:center;gap:5px;font-family:var(--en);font-weight:900;color:var(--red);font-size:1.1rem}
.hearts svg{width:26px;height:26px}
.hint-btn{width:36px;height:36px;border-radius:10px;font-size:1.25rem;display:flex;align-items:center;justify-content:center;background:var(--gold-bg);border:2px solid #F3DE8B}
.l-main{flex:1;overflow:auto;padding:8px 16px 24px}
.l-in{max-width:620px;margin:0 auto}
.l-in h3{margin:14px 0 14px;font-size:1.45rem;font-weight:700}
.say{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.say .mascot{width:86px;height:86px;flex:none}
.bubble{
  position:relative;flex:1;border:2px solid var(--line);border-radius:18px;padding:14px 16px;font-size:1.28rem;line-height:1.55;font-weight:500;background:#fff
}
.bubble::before{content:"";position:absolute;left:-9px;top:50%;width:14px;height:14px;background:#fff;border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateY(-50%) rotate(45deg)}
.answer{
  min-height:132px;padding:6px 0;display:flex;flex-wrap:wrap;gap:8px 8px;align-content:flex-start;position:relative;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 55px,var(--line) 55px,var(--line) 57px);
  border-top:2px solid var(--line);
}
.answer.ok .tile,.answer.bad .tile{pointer-events:none}
.bank{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 8px;margin-top:22px}
.tile{
  font-family:var(--en);font-weight:800;font-size:1.12rem;color:var(--ink);
  padding:9px 14px;border-radius:14px;background:#fff;border:2px solid var(--line2);border-bottom-width:4px;
  min-height:46px;transition:transform .08s,border-bottom-width .08s;
}
.tile:active{transform:translateY(2px);border-bottom-width:2px}
.tile.ghost{background:#EEF2F9;border-color:#EEF2F9;color:transparent;pointer-events:none;box-shadow:none}
.answer .tile{animation:pop .12s ease-out}
@keyframes pop{from{transform:scale(.9)}}
.end-mark{font-family:var(--en);font-weight:800;font-size:1.12rem;padding:9px 0 9px 0;color:var(--ink2);align-self:flex-start}

.l-bottom{border-top:2px solid var(--line);background:#fff;padding:14px 16px calc(14px + env(safe-area-inset-bottom))}
.l-bottom.ok{background:var(--green-bg);border-color:var(--green-bg)}
.l-bottom.bad{background:var(--red-bg);border-color:var(--red-bg)}
.l-bot-in{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.fb{flex:1;min-width:200px}
.fb b{display:flex;align-items:center;gap:8px;font-size:1.3rem;font-weight:700}
.l-bottom.ok .fb b{color:var(--green-ink)} .l-bottom.bad .fb b{color:var(--red-ink)}
.fb p{margin:4px 0 0;font-family:var(--en);font-weight:800;font-size:1.05rem;color:var(--red-ink);line-height:1.45}
.fb p small{display:block;font-family:var(--bn);font-weight:600;font-size:.85rem;color:var(--red-ink);opacity:.85}
.l-bottom.ok .fb p{color:var(--green-ink)}
.spk{width:40px;height:40px;border-radius:12px;background:#fff;display:inline-flex;align-items:center;justify-content:center;border:2px solid rgba(0,0,0,.08);flex:none}
.spk svg{width:22px;height:22px}
.l-bot-in .btn{min-width:150px}
.l-bot-in .btn.solo{width:100%}
.l-bottom.ok .btn{background:var(--green);border-color:var(--green-d)}
.l-bottom.bad .btn{background:var(--red);border-color:var(--red-d);color:#fff}
@media(max-width:520px){.l-bot-in .btn{width:100%}}

/* ---------- result screens ---------- */
.result{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 20px;gap:12px;overflow:auto}
.result .mascot{width:140px;height:140px}
.result h2{margin:6px 0 0;font-size:1.9rem;font-weight:700}
.result p{margin:0;color:var(--ink2);font-size:1.05rem}
.big-stars{display:flex;gap:8px;margin:4px 0}
.big-stars svg{width:54px;height:54px}
.big-stars svg:nth-child(2){transform:translateY(-10px)}
.tiles3{display:flex;gap:10px;margin:8px 0 6px;flex-wrap:wrap;justify-content:center}
.stat{min-width:104px;border-radius:16px;border:2px solid;overflow:hidden;background:#fff}
.stat i{display:block;font-style:normal;padding:4px 8px;font-weight:700;font-size:.8rem;color:#fff}
.stat span{display:block;padding:10px 8px;font-family:var(--en);font-weight:900;font-size:1.35rem}
.stat.a{border-color:var(--gold)} .stat.a i{background:var(--gold)} .stat.a span{color:var(--gold-d)}
.stat.b{border-color:var(--green)} .stat.b i{background:var(--green)} .stat.b span{color:var(--green-ink)}
.stat.c{border-color:var(--blue)} .stat.c i{background:var(--blue)} .stat.c span{color:var(--blue)}
.result .acts{width:100%;max-width:420px;display:flex;flex-direction:column;gap:10px;margin-top:10px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="mascot" viewBox="0 0 80 80">
      <path d="M6 34 L40 24 L74 34 L74 64 L40 56 L6 64Z" fill="#1F6FEB"/>
      <path d="M6 64 L40 56 L74 64 L74 68 L40 60 L6 68Z" fill="#1656BC"/>
      <path d="M11 36 L38 29 L38 54 L11 60Z" fill="#fff"/>
      <path d="M69 36 L42 29 L42 54 L69 60Z" fill="#fff"/>
      <circle cx="26" cy="42" r="3.4" fill="#15264F"/><circle cx="54" cy="42" r="3.4" fill="#15264F"/>
      <circle cx="21" cy="49" r="3" fill="#FFC1A6" opacity=".8"/><circle cx="59" cy="49" r="3" fill="#FFC1A6" opacity=".8"/>
      <path d="M33 47 Q40 54 47 47" stroke="#15264F" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <path d="M40 5 L64 15 L40 25 L16 15Z" fill="#15264F"/>
      <path d="M27 20 V27 Q40 33 53 27 V20 L40 25Z" fill="#15264F"/>
      <path d="M64 15 V27" stroke="#F5741F" stroke-width="2.4" stroke-linecap="round"/><circle cx="64" cy="29" r="3" fill="#F5741F"/>
    </symbol>
    <symbol id="star" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z" fill="currentColor"/></symbol>
    <symbol id="heart" viewBox="0 0 24 24"><path d="M12 21s-8-5.3-8-11.2C4 6.6 6.3 4.5 8.9 4.5c1.4 0 2.7.7 3.1 1.9.4-1.2 1.7-1.9 3.1-1.9C17.7 4.5 20 6.6 20 9.8 20 15.700 12 21 12 21z" fill="currentColor"/></symbol>
    <symbol id="spk" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="#1F6FEB"/><path d="M16 8.5c1.6 1.6 1.6 5.4 0 7M18.6 6c3 3 3 9 0 12" stroke="#1F6FEB" stroke-width="2" fill="none" stroke-linecap="round"/></symbol>
  </defs>
</svg>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <svg viewBox="0 0 80 80" aria-hidden="true"><use href="#mascot"/></svg>
      <div>
        <b><i>Anis</i> Spoken <u>English</u> Lab</b>
        <small>Speak English, Build Your Future</small>
      </div>
    </div>
    <div class="stats">
      <div class="chip fire" title="টানা দিন">🔥 <span id="stStreak">0</span></div>
      <div class="chip xp" title="XP">⚡ <span id="stXp">0</span></div>
    </div>
  </div>
</header>

<section class="hero">
  <svg class="mascot" viewBox="0 0 80 80" aria-hidden="true"><use href="#mascot"/></svg>
  <div>
    <h1>বাক্য সাজাও, ইংরেজি শেখো</h1>
    <p>বাংলা বাক্য দেখে ইংরেজি শব্দগুলো সঠিক ক্রমে সাজাও। <span id="ruleCount">৫৫</span>টি নিয়ম, প্রতিটিতে ছোট একটি লেসন।</p>
  </div>
</section>
<div class="overall">
  <div class="bar"><i id="overallBar" style="width:0%"></i></div>
  <small id="overallTxt"></small>
</div>

<main class="path" id="path"></main>

<div class="foot">
  <div>Anis Spoken English Lab — Practice Makes Perfect</div>
  <button id="resetBtn">অগ্রগতি মুছে নতুন করে শুরু করো</button>
</div>

<!-- rule / intro sheet -->
<div class="backdrop" id="sheetBd">
  <div class="sheet" role="dialog" aria-modal="true" id="sheet"></div>
</div>

<!-- lesson -->
<div id="lesson" aria-live="polite"></div>

<script>
/* ================= DATA ================= */

const BND='০১২৩৪৫৬৭৮৯';
const bn = n => String(n).replace(/\d/g,d=>BND[d]);
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function dayStr(off){const d=new Date();d.setDate(d.getDate()+off);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}

const OFF=[0,44,66,44,0,-44,-66,-44];
const UNIT_CLASS=['u0','u1','u2','u3','u4'];
const starSvg=(c,s)=>`<svg viewBox="0 0 24 24" style="color:${c}"><use href="#star"/></svg>`;

function renderHome(){
  $('#stXp').textContent=bn(save.xp);
  $('#stStreak').textContent=bn(shownStreak());
  const doneCount=RULES.filter(r=>save.done[r.n]).length;
  $('#ruleCount').textContent=bn(RULES.length);
  $('#overallBar').style.width=(doneCount/RULES.length*100)+'%';
  $('#overallTxt').textContent=bn(doneCount)+'/'+bn(RULES.length)+' টি নিয়ম সম্পন্ন';
  const path=$('#path');path.innerHTML='';
  const cur=RULES.findIndex(r=>!save.done[r.n]);
  RULES.forEach((r,i)=>{
    if(i%5===0){
      const end=Math.min(i+5,RULES.length);
      const u=document.createElement('div');
      u.className='unit '+UNIT_CLASS[(i/5)%UNIT_CLASS.length];
      u.innerHTML=`<div><b>ইউনিট ${bn(i/5+1)}</b><span>নিয়ম ${bn(i+1)} – ${bn(end)}</span></div><em>${esc(LABELS[i])}</em>`;
      path.appendChild(u);
    }
    const st=save.done[r.n];
    const w=document.createElement('div');
    w.className='node-wrap';
    w.style.transform=`translateX(${OFF[i%OFF.length]}px)`;
    let cls='node';if(st)cls+=' done';else if(i===cur)cls+=' cur';
    const inner=st?`<svg viewBox="0 0 24 24" style="color:#fff"><use href="#star"/></svg>`:bn(r.n);
    w.innerHTML=(i===cur?'<div class="start-tip">শুরু করো</div>':'')+
      `<button class="${cls}" aria-label="নিয়ম ${r.n}: ${esc(LABELS[i])}" data-i="${i}">${inner}</button>`+
      (st?`<div class="stars">${[1,2,3].map(k=>starSvg(k<=st?'#FFC800':'#D5DCEA')).join('')}</div>`:'')+
      `<div class="node-label en">${esc(LABELS[i])}</div>`;
    path.appendChild(w);
  });
  path.querySelectorAll('.node').forEach(b=>b.addEventListener('click',()=>openIntro(+b.dataset.i)));
}

/* ================= LESSON ================= */
const CONFUSE={is:'are',are:'is',am:'is',was:'were',were:'was',has:'have',have:'has',had:'has',do:'does',does:'do',a:'an',an:'a',they:'we',we:'they'};
const CHEERS=['দারুণ!','চমৎকার!','একদম ঠিক!','অসাধারণ!','দুর্দান্ত!'];
let L=null;

function buildItem(pair){
  const [bnTxt,en]=pair;
  const m=en.match(/[.?!]+$/);const end=m?m[0]:'';
  const core=end?en.slice(0,-end.length):en;
  const words=core.split(' ');
  const clean=w=>w.toLowerCase().replace(/[^a-z']/g,'');
  const present=new Set(words.map(clean));
  const extra=[];
  const maxExtra=words.length>=5?2:1;
  for(const w of words){
    const c=clean(w);
    if(CONFUSE[c]&&!present.has(CONFUSE[c])&&!extra.includes(CONFUSE[c])&&extra.length<maxExtra&&words.length>=3){extra.push(CONFUSE[c])}
  }
  let tiles=words.map((w,i)=>({id:i,txt:w})).concat(extra.map((w,k)=>({id:words.length+k,txt:w})));
  let order=shuffle(tiles),tries=0;
  while(tries++<8&&order.slice(0,words.length).every((t,i)=>t.id===i)&&order.length===words.length)order=shuffle(tiles);
  return {bn:bnTxt,en,end,words,target:words.join(' '),tiles:order,byId:Object.fromEntries(tiles.map(t=>[t.id,t]))};
}

function startLesson(i){
  const r=RULES[i];
  const pool=shuffle(r.s).slice(0,10);
  L={i,rule:r,queue:pool.map(buildItem),idx:0,total:pool.length,done:0,hearts:5,lost:0,ans:[],state:'ask'};
  const el=$('#lesson');el.classList.add('open');document.body.style.overflow='hidden';
  renderLesson();
}
function closeLesson(){
  $('#lesson').classList.remove('open');document.body.style.overflow='';L=null;renderHome();
}
function heartsHtml(){return `<div class="hearts" aria-label="হার্ট ${L.hearts}"><svg viewBox="0 0 24 24"><use href="#heart"/></svg>${bn(L.hearts)}</div>`}

function renderLesson(){
  const el=$('#lesson');
  el.innerHTML=`
    <div class="l-top">
      <button class="x" id="xBtn" aria-label="বন্ধ করো">×</button>
      <div class="bar"><i id="lBar" style="width:0%"></i></div>
      <button class="hint-btn" id="hintBtn" aria-label="নিয়ম দেখো">💡</button>
      <div id="heartsBox">${heartsHtml()}</div>
    </div>
    <div class="l-main"><div class="l-in" id="qBox"></div></div>
    <div class="l-bottom" id="bottom"><div class="l-bot-in" id="botIn"></div></div>`;
  $('#xBtn').onclick=confirmQuit;
  $('#hintBtn').onclick=()=>openRuleOnly(L.rule);
  renderQuestion();
}
function updateTop(){
  $('#lBar').style.width=(L.done/L.total*100)+'%';
  $('#heartsBox').innerHTML=heartsHtml();
}
function confirmQuit(){
  openSheet(`<h2 class="center">এখন থামলে এই লেসনের অগ্রগতি হারিয়ে যাবে।</h2>
    <div class="row"><button class="btn primary block" id="stayBtn">লেসন চালিয়ে যাও</button><button class="btn danger block" id="quitBtn">বন্ধ করো</button></div>`);
  $('#stayBtn').onclick=closeSheet;
  $('#quitBtn').onclick=()=>{closeSheet();closeLesson()};
}

function renderQuestion(){
  const q=L.queue[L.idx];L.ans=[];L.state='ask';
  updateTop();
  $('#qBox').innerHTML=`
    <h3>বাক্যটি ইংরেজিতে সাজাও</h3>
    <div class="say"><svg class="mascot" viewBox="0 0 80 80" aria-hidden="true"><use href="#mascot"/></svg><div class="bubble">${esc(q.bn)}</div></div>
    <div class="answer" id="answer"></div>
    <div class="bank" id="bank"></div>`;
  const b=$('#bottom');b.className='l-bottom';
  $('#botIn').innerHTML=`<button class="btn primary solo" id="checkBtn" disabled>যাচাই করো</button>`;
  $('#checkBtn').onclick=checkAnswer;
  paint();
}
function paint(){
  const q=L.queue[L.idx];
  const a=$('#answer'),bank=$('#bank');
  a.innerHTML='';bank.innerHTML='';
  L.ans.forEach((id,pos)=>{
    const t=document.createElement('button');t.className='tile';t.textContent=q.byId[id].txt;
    t.onclick=()=>{if(L.state!=='ask')return;L.ans.splice(pos,1);paint()};
    a.appendChild(t);
  });
  if(q.end&&L.ans.length===q.words.length){/* end mark shown after a full-length answer */
    const m=document.createElement('span');m.className='end-mark';m.textContent=q.end;a.appendChild(m);
  }
  q.tiles.forEach(t=>{
    const b=document.createElement('button');b.className='tile'+(L.ans.includes(t.id)?' ghost':'');b.textContent=t.txt;
    b.onclick=()=>{if(L.state!=='ask'||L.ans.includes(t.id))return;L.ans.push(t.id);paint()};
    bank.appendChild(b);
  });
  const cb=$('#checkBtn');if(cb)cb.disabled=L.ans.length===0;
}

function speak(text){
  try{window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.9;window.speechSynthesis.speak(u)}catch(e){}
}
function checkAnswer(){
  if(L.state!=='ask'||!L.ans.length)return;
  const q=L.queue[L.idx];
  const given=L.ans.map(id=>q.byId[id].txt).join(' ');
  const ok=given===q.target;
  L.state=ok?'ok':'bad';
  const b=$('#bottom');b.className='l-bottom '+(ok?'ok':'bad');
  $('#answer').classList.add(ok?'ok':'bad');
  const full=q.en;
  if(ok){
    L.done++;
    $('#botIn').innerHTML=`<div class="fb"><b>✔ ${CHEERS[Math.floor(Math.random()*CHEERS.length)]}</b><p>${esc(full)}</p></div>
      <button class="spk" id="spkBtn" aria-label="উচ্চারণ শোনো"><svg viewBox="0 0 24 24"><use href="#spk"/></svg></button>
      <button class="btn primary" id="nextBtn">এগিয়ে যাও</button>`;
  }else{
    L.hearts--;L.lost++;
    L.queue.push(buildItem([q.bn,q.en]));
    $('#botIn').innerHTML=`<div class="fb"><b>✖ ঠিক হয়নি</b><p><small>সঠিক উত্তর:</small>${esc(full)}</p></div>
      <button class="spk" id="spkBtn" aria-label="উচ্চারণ শোনো"><svg viewBox="0 0 24 24"><use href="#spk"/></svg></button>
      <button class="btn danger" id="nextBtn">${L.hearts<=0?'ঠিক আছে':'এগিয়ে যাও'}</button>`;
  }
  updateTop();
  $('#spkBtn').onclick=()=>speak(full);
  $('#nextBtn').onclick=nextQuestion;
  $('#nextBtn').focus();
}
function nextQuestion(){
  if(L.hearts<=0){return renderFail()}
  if(L.done>=L.total||L.idx+1>=L.queue.length){return renderComplete()}
  L.idx++;renderQuestion();
}

function renderFail(){
  $('#lesson').innerHTML=`<div class="result">
    <svg class="mascot" viewBox="0 0 80 80" aria-hidden="true" style="filter:grayscale(.4)"><use href="#mascot"/></svg>
    <h2>হার্ট শেষ হয়ে গেছে</h2>
    <p>চিন্তা নেই, নিয়মটা আরেকবার দেখে নতুন করে চেষ্টা করো।</p>
    <div class="acts">
      <button class="btn primary block" id="retryBtn">আবার চেষ্টা করো</button>
      <button class="btn block" id="ruleBtn">নিয়মটি দেখো</button>
      <button class="btn block" id="homeBtn">হোমে ফিরে যাও</button>
    </div></div>`;
  $('#retryBtn').onclick=()=>startLesson(L.i);
  $('#ruleBtn').onclick=()=>openRuleOnly(L.rule);
  $('#homeBtn').onclick=closeLesson;
}
function renderComplete(){
  const stars=L.lost===0?3:(L.lost<=2?2:1);
  const xp=L.total*2+(L.lost===0?5:0);
  const acc=Math.round(L.total/(L.total+L.lost)*100);
  const n=L.rule.n;
  save.xp+=xp;
  save.done[n]=Math.max(save.done[n]||0,stars);
  if(save.last!==dayStr(0)){save.streak=(save.last===dayStr(-1))?save.streak+1:1;save.last=dayStr(0)}
  persist();
  const big=[1,2,3].map(k=>`<svg viewBox="0 0 24 24" style="color:${k<=stars?'#FFC800':'#D5DCEA'}"><use href="#star"/></svg>`).join('');
  const next=RULES.findIndex(r=>r.n===n)+1;
  const hasNext=next<RULES.length;
  const i0=L.i;
  $('#lesson').innerHTML=`<div class="result">
    <svg class="mascot" viewBox="0 0 80 80" aria-hidden="true"><use href="#mascot"/></svg>
    <h2>লেসন সম্পন্ন!</h2>
    <p>নিয়ম ${bn(n)} · ${esc(LABELS[i0])}</p>
    <div class="big-stars">${big}</div>
    <div class="tiles3">
      <div class="stat a"><i>মোট XP</i><span>${bn(xp)}</span></div>
      <div class="stat b"><i>নির্ভুলতা</i><span>${bn(acc)}%</span></div>
      <div class="stat c"><i>বাকি হার্ট</i><span>${bn(L.hearts)}</span></div>
    </div>
    <div class="acts">
      ${hasNext?'<button class="btn primary block" id="nextRule">পরের নিয়ম</button>':''}
      <button class="btn ${hasNext?'':'primary'} block" id="againBtn">আবার অনুশীলন করো</button>
      <button class="btn block" id="homeBtn">হোমে ফিরে যাও</button>
    </div></div>`;
  if(hasNext)$('#nextRule').onclick=()=>startLesson(next);
  $('#againBtn').onclick=()=>startLesson(i0);
  $('#homeBtn').onclick=()=>{closeLesson();const c=document.querySelector('.node.cur');if(c)c.scrollIntoView({block:'center',behavior:'smooth'})};
}

/* keyboard: Enter = main button */
document.addEventListener('keydown',e=>{
  if(!L||e.key!=='Enter')return;
  if($('#sheetBd').classList.contains('open'))return;
  const n=$('#nextBtn');if(n){n.click();return}
  const c=$('#checkBtn');if(c&&!c.disabled)c.click();
});

/* reset */
$('#resetBtn').onclick=()=>{
  openSheet(`<h2 class="center">সব অগ্রগতি মুছে ফেলবে?</h2>
    <div class="row"><button class="btn block" id="noBtn">না, থাক</button><button class="btn danger block" id="yesBtn">হ্যাঁ, মুছে ফেলো</button></div>`);
  $('#noBtn').onclick=closeSheet;
  $('#yesBtn').onclick=()=>{save={xp:0,done:{},streak:0,last:''};persist();closeSheet();renderHome();window.scrollTo({top:0,behavior:'smooth'})};
};

renderHome();
(function(){const c=document.querySelector('.node.cur');if(c&&Object.keys(save.done).length){setTimeout(()=>c.scrollIntoView({block:'center'}),60)}})();
</script>
</body>
</html>
